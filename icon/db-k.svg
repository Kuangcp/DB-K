<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- db-k 应用图标母版（1024 网格，无文字/字体依赖）
       白色圆角底（深色任务栏下对比度最高）+ 简约几何 K（三笔圆头）：
       竖杆=品牌蓝 #2F6FE4（主体，最后绘制压住交界），上臂青 #22B8E6，下臂靛 #6C63FF。
       改版史：深色底 + 圆柱 → 亮蓝底 + 圆柱 → 白底 + 圆柱 → 白底 + 三段色 K（中间图案更清楚）。 -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="#FFFFFF"/>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="none" stroke="#C8D6EC" stroke-width="8"/>
  <path d="M370 520 L 664 306" fill="none" stroke="#22B8E6" stroke-width="108" stroke-linecap="round"/>
  <path d="M370 520 L 664 734" fill="none" stroke="#6C63FF" stroke-width="108" stroke-linecap="round"/>
  <path d="M370 290 V 734" fill="none" stroke="#2F6FE4" stroke-width="116" stroke-linecap="round"/>
</svg>
